<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gkampas Social</title>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0a0f1e;
  color: white;
}

/* TOPBAR */
.topbar {
  position: sticky;
  top: 0;
  display: flex;
  justify-content: space-between;
  padding: 12px 16px;
  background: rgba(10,15,30,0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.topbar button {
  background: rgba(255,255,255,0.08);
  border: none;
  color: white;
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
}

/* FEED */
.feed {
  max-width: 500px;
  margin: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* POST */
.post {
  background: rgba(255,255,255,0.04);
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.06);
}

.post img {
  width: 100%;
  display: block;
}

/* ACTIONS */
.actions {
  display: flex;
  gap: 12px;
  padding: 10px;
  font-size: 20px;
}

.icon {
  cursor: pointer;
}

/* CONTENT */
.content {
  padding: 0 10px 10px;
}

.likes {
  font-weight: bold;
}

.desc {
  opacity: 0.7;
}

/* UPLOAD */
.upload {
  max-width: 500px;
  margin: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.upload input {
  padding: 10px;
  border-radius: 8px;
  border: none;
}

.upload button {
  padding: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="topbar">
  <b>Gkampas Social</b>
  <div id="userBox">
    <button onclick="login()">Login</button>
  </div>
</div>

<div id="uploadBox"></div>
<div id="feed" class="feed"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  doc,
  updateDoc,
  serverTimestamp,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBUWEdDO4t0ej8Xbb4XRbnVHIPkNLGyc9c",
  authDomain: "gkampasgallery.firebaseapp.com",
  projectId: "gkampasgallery",
  storageBucket: "gkampasgallery.firebasestorage.app",
  messagingSenderId: "697722298225",
  appId: "1:697722298225:web:e6ffc5ba7ea55744bb20d0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;

/* AUTH */
window.login = () => signInWithPopup(auth, provider);
window.logout = () => signOut(auth);

/* USER STATE */
onAuthStateChanged(auth, (user) => {

  currentUser = user;

  const box = document.getElementById("userBox");
  const uploadBox = document.getElementById("uploadBox");

  if (user) {

    box.innerHTML = `
      <span>${user.displayName}</span>
      <button onclick="logout()">Logout</button>
    `;

    uploadBox.innerHTML = `
      <div class="upload">
        <input id="img" placeholder="Image URL">
        <input id="title" placeholder="Title">
        <input id="desc" placeholder="Description">
        <button onclick="uploadPost()">Upload</button>
      </div>
    `;

  } else {

    box.innerHTML = `<button onclick="login()">Login</button>`;
    uploadBox.innerHTML = "";

  }
});

/* UPLOAD POST */
window.uploadPost = async () => {

  const img = document.getElementById("img").value;
  const title = document.getElementById("title").value;
  const desc = document.getElementById("desc").value;

  if (!img) return;

  await addDoc(collection(db, "posts"), {
    image: img,
    title,
    description: desc,
    likes: {},
    createdAt: serverTimestamp()
  });

};

/* FEED */
const feed = document.getElementById("feed");

const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));

onSnapshot(q, (snap) => {

  feed.innerHTML = "";

  snap.forEach((d) => {

    const post = d.data();
    const id = d.id;

    const likes = post.likes || {};
    const count = Object.keys(likes).length;
    const liked = currentUser && likes[currentUser.uid];

    feed.innerHTML += `
      <div class="post">

        <img src="${post.image}">

        <div class="actions">
          <span class="icon" onclick="likePost('${id}')">
            ${liked ? "❤️" : "🤍"}
          </span>
          <span class="icon">💬</span>
        </div>

        <div class="content">
          <div class="likes">${count} likes</div>
          <b>${post.title}</b>
          <div class="desc">${post.description}</div>
        </div>

      </div>
    `;

  });

});

/* LIKE (FIXED) */
window.likePost = async (postId) => {

  if (!currentUser) {
    await signInWithPopup(auth, provider);
    return;
  }

  const ref = doc(db, "posts", postId);

  const snap = await getDoc(ref);
  const data = snap.data();

  const likes = data.likes || {};
  const uid = currentUser.uid;

  if (likes[uid]) {
    delete likes[uid];
  } else {
    likes[uid] = true;
  }

  await updateDoc(ref, { likes });

};

</script>

</body>
</html>
