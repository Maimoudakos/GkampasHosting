<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Style Gallery</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0f1a;
  color: white;
}

/* HEADER */
header {
  text-align: center;
  padding: 30px;
}

/* USER */
#userBox {
  display: flex;
  justify-content: center;
  padding: 10px;
}

.user-info, .login-btn {
  background: rgba(255,255,255,0.08);
  padding: 10px 15px;
  border-radius: 10px;
  border: none;
  color: white;
  cursor: pointer;
}

/* UPLOAD */
.upload {
  max-width: 600px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
}

.upload input {
  padding: 10px;
  border-radius: 8px;
  border: none;
}

/* FEED */
.feed {
  display: flex;
  flex-direction: column;
  gap: 25px;
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

/* POST */
.post {
  background: rgba(255,255,255,0.05);
  border-radius: 15px;
  overflow: hidden;
}

/* IMAGE WRAPPER */
.post-media {
  position: relative;
}

.post img {
  width: 100%;
  display: block;
}

/* ICONS OVERLAY */
.post-icons {
  position: absolute;
  bottom: 10px;
  right: 10px;
  display: flex;
  gap: 10px;
}

.icon {
  background: rgba(0,0,0,0.6);
  padding: 8px 10px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 16px;
  transition: 0.2s;
  user-select: none;
}

.icon:hover {
  transform: scale(1.1);
}

/* CONTENT */
.post-content {
  padding: 10px;
}

.likes {
  font-size: 14px;
  opacity: 0.8;
  margin-bottom: 5px;
}

/* COMMENTS */
.comment {
  font-size: 14px;
  opacity: 0.8;
  margin: 5px 0;
}

.comment-input {
  display: flex;
  gap: 5px;
  margin-top: 10px;
}

.comment-input input {
  flex: 1;
  padding: 8px;
  border-radius: 8px;
  border: none;
}

.comment-input button {
  padding: 8px 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

</style>
</head>

<body>

<div id="userBox"></div>

<header>
  <h1>Instagram Style Feed</h1>
</header>

<div id="uploadBox"></div>

<div class="feed" id="feed"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp,
  doc,
  updateDoc,
  increment
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBUWEdDO4t0ej8Xbb4XRbnVHIPkNLGyc9c",
  authDomain: "gkampasgallery.firebaseapp.com",
  projectId: "gkampasgallery",
  storageBucket: "gkampasgallery.firebasestorage.app",
  messagingSenderId: "697722298225",
  appId: "1:697722298225:web:e6ffc5ba7ea55744bb20d0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

/* AUTH */
window.login = () => signInWithPopup(auth, provider);
window.logout = () => signOut(auth);

/* USER UI */
onAuthStateChanged(auth, (user) => {

  const box = document.getElementById("userBox");

  if (user) {
    box.innerHTML = `
      <div class="user-info">
        <span>${user.displayName}</span>
        <button onclick="logout()">Logout</button>
      </div>
    `;

    document.getElementById("uploadBox").innerHTML = `
      <div class="upload">
        <input id="img" placeholder="Image URL">
        <input id="title" placeholder="Title">
        <input id="desc" placeholder="Description">
        <button onclick="uploadPost()">Upload</button>
      </div>
    `;
  } else {
    box.innerHTML = `<button class="login-btn" onclick="login()">Sign in with Google</button>`;
  }
});

/* UPLOAD */
window.uploadPost = async () => {
  const img = document.getElementById("img").value;
  const title = document.getElementById("title").value;
  const desc = document.getElementById("desc").value;

  await addDoc(collection(db, "posts"), {
    image: img,
    title,
    description: desc,
    likes: 0,
    createdAt: serverTimestamp()
  });
};

/* LOAD FEED */
const feed = document.getElementById("feed");

const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));

onSnapshot(q, (snap) => {

  feed.innerHTML = "";

  snap.forEach((d) => {

    const post = d.data();
    const postId = d.id;

    feed.innerHTML += `
      <div class="post">

        <div class="post-media">

          <img src="${post.image}">

          <div class="post-icons">

            <div class="icon" onclick="likePost('${postId}')">❤️</div>

            <div class="icon" onclick="scrollToComments('${postId}')">💬</div>

          </div>

        </div>

        <div class="post-content">

          <div class="likes">❤️ ${post.likes || 0} likes</div>

          <b>${post.title}</b>
          <p>${post.description}</p>

          <div id="comments-${postId}"></div>

          <div class="comment-input">
            <input id="input-${postId}" placeholder="Write comment...">
            <button onclick="comment('${postId}')">Send</button>
          </div>

        </div>

      </div>
    `;

    loadComments(postId);
  });
});

/* LIKE */
window.likePost = async (postId) => {
  const ref = doc(db, "posts", postId);
  await updateDoc(ref, {
    likes: increment(1)
  });
};

/* COMMENTS */
function loadComments(postId) {

  const ref = collection(db, "posts", postId, "comments");

  onSnapshot(ref, (snap) => {

    const box = document.getElementById(`comments-${postId}`);
    if (!box) return;

    box.innerHTML = "";

    snap.forEach((c) => {
      box.innerHTML += `
        <div class="comment">
          <b>${c.data().name}</b>: ${c.data().text}
        </div>
      `;
    });

  });

}

/* COMMENT */
window.comment = async (postId) => {

  const user = auth.currentUser;
  if (!user) return;

  const input = document.getElementById(`input-${postId}`);

  await addDoc(collection(db, "posts", postId, "comments"), {
    name: user.displayName,
    text: input.value
  });

  input.value = "";
};

/* SCROLL */
window.scrollToComments = (postId) => {
  document.getElementById(`comments-${postId}`).scrollIntoView({
    behavior: "smooth"
  });
};

</script>

</body>
</html>
