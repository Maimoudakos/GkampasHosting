<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gkampas Social</title>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0a0f1e;
  color: white;
}

/* TOP BAR */
.topbar {
  position: sticky;
  top: 0;
  background: rgba(10,15,30,0.9);
  backdrop-filter: blur(12px);
  padding: 15px;
  text-align: center;
  font-weight: bold;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

/* FEED */
.feed {
  max-width: 500px;
  margin: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 25px;
}

/* POST CARD */
.post {
  background: rgba(255,255,255,0.04);
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.06);
}

/* HEADER */
.post-header {
  display: flex;
  align-items: center;
  padding: 10px;
  gap: 10px;
}

.avatar {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: gray;
}

/* IMAGE */
.post img {
  width: 100%;
  display: block;
}

/* ACTIONS */
.actions {
  display: flex;
  gap: 12px;
  padding: 10px;
  font-size: 20px;
}

.icon {
  cursor: pointer;
  opacity: 0.9;
  transition: 0.2s;
}

.icon:hover {
  transform: scale(1.2);
}

/* CONTENT */
.content {
  padding: 0 10px 10px;
}

.likes {
  font-weight: bold;
  font-size: 14px;
  margin-bottom: 5px;
}

.title {
  font-weight: 600;
}

.desc {
  opacity: 0.7;
  font-size: 14px;
}

/* COMMENTS */
.comment-box {
  padding: 10px;
  border-top: 1px solid rgba(255,255,255,0.06);
}

.comment {
  font-size: 13px;
  opacity: 0.8;
}

/* INPUT */
.comment-input {
  display: flex;
  border-top: 1px solid rgba(255,255,255,0.06);
}

.comment-input input {
  flex: 1;
  padding: 10px;
  border: none;
  outline: none;
  background: transparent;
  color: white;
}

.comment-input button {
  background: transparent;
  border: none;
  color: #4ea1ff;
  padding: 10px;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="topbar">Gkampas Social</div>

<div id="feed" class="feed"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  doc,
  updateDoc,
  arrayUnion,
  arrayRemove,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBUWEdDO4t0ej8Xbb4XRbnVHIPkNLGyc9c",
  authDomain: "gkampasgallery.firebaseapp.com",
  projectId: "gkampasgallery",
  storageBucket: "gkampasgallery.firebasestorage.app",
  messagingSenderId: "697722298225",
  appId: "1:697722298225:web:e6ffc5ba7ea55744bb20d0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;

onAuthStateChanged(auth, (user) => {
  currentUser = user;
});

const feed = document.getElementById("feed");

const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));

onSnapshot(q, (snap) => {

  feed.innerHTML = "";

  snap.forEach((d) => {

    const post = d.data();
    const id = d.id;

    const likes = post.likes || {};
    const likeCount = Object.keys(likes).length;
    const isLiked = currentUser && likes[currentUser.uid];

    feed.innerHTML += `
      <div class="post">

        <div class="post-header">
          <div class="avatar"></div>
          <b>Gkampas</b>
        </div>

        <img src="${post.image}">

        <div class="actions">
          <div class="icon" onclick="likePost('${id}')">
            ${isLiked ? "❤️" : "🤍"}
          </div>

          <div class="icon">💬</div>
        </div>

        <div class="content">
          <div class="likes">${likeCount} likes</div>
          <div class="title">${post.title}</div>
          <div class="desc">${post.description}</div>
        </div>

      </div>
    `;
  });

});

/* LIKE SYSTEM (REAL USER BASED) */
window.likePost = async (postId) => {

  if (!currentUser) {
    await signInWithPopup(auth, provider);
    return;
  }

  const ref = doc(db, "posts", postId);

  const snap = await getDoc(ref);
  const data = snap.data();

  const likes = data.likes || {};
  const uid = currentUser.uid;

  if (likes[uid]) {
    delete likes[uid];
  } else {
    likes[uid] = true;
  }

  await updateDoc(ref, { likes });

};

</script>

</body>
</html>
