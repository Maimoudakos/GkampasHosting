<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
  background: #000;
  color: white;
}

.topbar {
  height: 50px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 14px;
  border-bottom: 1px solid #222;
  position: sticky;
  top: 0;
  background: black;
  z-index: 10;
}

.feed {
  max-width: 470px;
  margin: auto;
}

.post {
  border-bottom: 1px solid #222;
  padding-bottom: 10px;
}

.post-header {
  display: flex;
  align-items: center;
  padding: 10px;
  gap: 10px;
}

.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #333;
}

.username {
  font-weight: 600;
  font-size: 14px;
}

.post img {
  width: 100%;
  display: block;
}

.actions {
  display: flex;
  justify-content: space-between;
  padding: 10px 12px 6px 12px;
  font-size: 22px;
}

.left-actions {
  display: flex;
  gap: 14px;
}

.icon {
  cursor: pointer;
}

.likes {
  font-weight: 600;
  font-size: 14px;
  padding: 0 12px;
}

.caption {
  padding: 6px 12px;
  font-size: 14px;
}

.comment-box {
  padding: 8px 12px;
}

.comment {
  font-size: 13px;
  opacity: 0.8;
  margin-bottom: 4px;
}

.comment-input {
  display: flex;
  gap: 6px;
  padding: 8px 12px;
}

.comment-input input {
  flex: 1;
  padding: 6px;
  background: #111;
  border: 1px solid #333;
  color: white;
}

button {
  background: none;
  border: 1px solid #333;
  color: white;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="topbar">
  <b>Instagram</b>
  <div id="userBox">
    <button onclick="login()">Login</button>
  </div>
</div>

<div style="max-width:470px;margin:auto;padding:10px;">
  <input id="img" placeholder="Image URL" style="width:100%;padding:8px;">
  <input id="title" placeholder="Title" style="width:100%;padding:8px;margin-top:5px;">
  <input id="desc" placeholder="Description" style="width:100%;padding:8px;margin-top:5px;">
  <button onclick="uploadPost()" style="margin-top:5px;">Post</button>
</div>

<div id="feed" class="feed"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot,
  doc,
  updateDoc,
  getDoc,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

import { addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBUWEdDO4t0ej8Xbb4XRbnVHIPkNLGyc9c",
  authDomain: "gkampasgallery.firebaseapp.com",
  projectId: "gkampasgallery",
  storageBucket: "gkampasgallery.firebasestorage.app",
  messagingSenderId: "697722298225",
  appId: "1:697722298225:web:e6ffc5ba7ea55744bb20d0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;

window.login = () => signInWithPopup(auth, provider);
window.logout = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  currentUser = user;

  document.getElementById("userBox").innerHTML = user
    ? `<button onclick="logout()">Logout</button>`
    : `<button onclick="login()">Login</button>`;
});

/* FEED */
const feed = document.getElementById("feed");

const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));

onSnapshot(q, (snap) => {

  feed.innerHTML = "";

  snap.forEach((d) => {

    const post = d.data();
    const id = d.id;

    const likes = post.likes || {};
    const likeCount = Object.keys(likes).length;
    const liked = currentUser && likes[currentUser.uid];

    feed.innerHTML += `
      <div class="post">

        <div class="post-header">
          <div class="avatar"></div>
          <div class="username">${post.userName || "unknown"}</div>
        </div>

        <img src="${post.image}">

        <div class="actions">
          <div class="left-actions">
            <div class="icon" onclick="likePost('${id}')">
              ${liked ? "❤️" : "🤍"}
            </div>
            <div class="icon" onclick="focusComment('${id}')">💬</div>
          </div>
        </div>

        <div class="likes">${likeCount} likes</div>

        <div class="caption">
          <b>${post.title}</b> ${post.description}
        </div>

        <div id="comments-${id}" class="comment-box"></div>

        <div class="comment-input">
          <input id="input-${id}" placeholder="Add a comment...">
          <button onclick="sendComment('${id}')">Post</button>
        </div>

      </div>
    `;

    loadComments(id);
  });

});

window.uploadPost = async () => {

  if (!currentUser) {
    await signInWithPopup(auth, provider);
    return;
  }

  const img = document.getElementById("img").value;
  const title = document.getElementById("title").value;
  const desc = document.getElementById("desc").value;

  if (!img) return;

  await addDoc(collection(db, "posts"), {
    image: img,
    title: title,
    description: desc,
    userName: currentUser.displayName,
    createdAt: serverTimestamp(),
    likes: {}
  });

};

/* LIKE SYSTEM (SAFE) */
window.likePost = async (postId) => {

  if (!currentUser) return signInWithPopup(auth, provider);

  const ref = doc(db, "posts", postId);
  const snap = await getDoc(ref);

  const data = snap.data();
  const likes = data.likes || {};
  const uid = currentUser.uid;

  if (likes[uid]) delete likes[uid];
  else likes[uid] = true;

  await updateDoc(ref, { likes });
};

/* COMMENTS LOAD */
function loadComments(postId) {

  const q = query(collection(db, "posts", postId, "comments"), orderBy("createdAt", "desc"));

  onSnapshot(q, (snap) => {

    const box = document.getElementById(`comments-${postId}`);
    if (!box) return;

    box.innerHTML = "";

    snap.forEach(c => {
      const data = c.data();
      box.innerHTML += `
        <div class="comment">
          <b>${data.name}:</b> ${data.text}
        </div>
      `;
    });

  });

}

/* SEND COMMENT */
window.sendComment = async (postId) => {

  if (!currentUser) return signInWithPopup(auth, provider);

  const input = document.getElementById(`input-${postId}`);

  if (!input.value.trim()) return;

  await addDoc(collection(db, "posts", postId, "comments"), {
    name: currentUser.displayName,
    text: input.value,
    createdAt: serverTimestamp()
  });

  input.value = "";
};

</script>

</body>
</html>
