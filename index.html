<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gkampas Social</title>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0a0f1e;
  color: white;
}

/* TOP BAR */
.topbar {
  position: sticky;
  top: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  background: rgba(10,15,30,0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.topbar button {
  background: rgba(255,255,255,0.08);
  border: none;
  color: white;
  padding: 8px 12px;
  border-radius: 10px;
  cursor: pointer;
}

/* USER INFO */
.user {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* FEED */
.feed {
  max-width: 500px;
  margin: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 25px;
}

/* POST */
.post {
  background: rgba(255,255,255,0.04);
  border-radius: 18px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.06);
}

.post-header {
  display: flex;
  align-items: center;
  padding: 10px;
  gap: 10px;
}

.avatar {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: gray;
}

.post img {
  width: 100%;
}

.actions {
  display: flex;
  gap: 12px;
  padding: 10px;
  font-size: 20px;
}

.icon {
  cursor: pointer;
}

/* CONTENT */
.content {
  padding: 0 10px 10px;
}

.likes {
  font-weight: bold;
  font-size: 14px;
}

.title {
  font-weight: 600;
}

.desc {
  opacity: 0.7;
  font-size: 14px;
}

</style>
</head>

<body>

<div class="topbar">

  <div><b>Gkampas Social</b></div>

  <div class="user" id="userBox">
    <button onclick="login()">Login</button>
  </div>

</div>

<div id="feed" class="feed"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  query,
  orderBy,
  onSnapshot,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBUWEdDO4t0ej8Xbb4XRbnVHIPkNLGyc9c",
  authDomain: "gkampasgallery.firebaseapp.com",
  projectId: "gkampasgallery",
  storageBucket: "gkampasgallery.firebasestorage.app",
  messagingSenderId: "697722298225",
  appId: "1:697722298225:web:e6ffc5ba7ea55744bb20d0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;

/* AUTH BUTTONS */
window.login = () => signInWithPopup(auth, provider);
window.logout = () => signOut(auth);

/* USER STATE UI */
onAuthStateChanged(auth, (user) => {

  currentUser = user;

  const box = document.getElementById("userBox");

  if (user) {
    box.innerHTML = `
      <span>${user.displayName}</span>
      <button onclick="logout()">Logout</button>
    `;
  } else {
    box.innerHTML = `<button onclick="login()">Login</button>`;
  }

});

/* FEED */
const feed = document.getElementById("feed");

const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));

onSnapshot(q, (snap) => {

  feed.innerHTML = "";

  snap.forEach((d) => {

    const post = d.data();
    const id = d.id;

    const likes = post.likes || {};
    const count = Object.keys(likes).length;
    const liked = currentUser && likes[currentUser.uid];

    feed.innerHTML += `
      <div class="post">

        <div class="post-header">
          <div class="avatar"></div>
          <b>Gkampas</b>
        </div>

        <img src="${post.image}">

        <div class="actions">
          <span class="icon" onclick="likePost('${id}')">
            ${liked ? "❤️" : "🤍"}
          </span>
          <span class="icon">💬</span>
        </div>

        <div class="content">
          <div class="likes">${count} likes</div>
          <div class="title">${post.title}</div>
          <div class="desc">${post.description}</div>
        </div>

      </div>
    `;

  });

});

/* LIKE SYSTEM */
window.likePost = async (postId) => {

  if (!currentUser) {
    await signInWithPopup(auth, provider);
    return;
  }

  const ref = doc(db, "posts", postId);

  const snap = await (await import("https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js")).getDoc(ref);
  const data = snap.data();

  const likes = data.likes || {};
  const uid = currentUser.uid;

  if (likes[uid]) {
    delete likes[uid];
  } else {
    likes[uid] = true;
  }

  await updateDoc(ref, { likes });

};

</script>

</body>
</html>
