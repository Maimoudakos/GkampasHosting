<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
  background: #000;
  color: white;
}

/* TOP BAR (Instagram style) */
.topbar {
  height: 50px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 14px;
  border-bottom: 1px solid #222;
  position: sticky;
  top: 0;
  background: black;
  z-index: 10;
}

/* FEED */
.feed {
  max-width: 470px;
  margin: auto;
}

/* POST */
.post {
  border-bottom: 1px solid #222;
  padding-bottom: 10px;
}

/* HEADER */
.post-header {
  display: flex;
  align-items: center;
  padding: 10px;
  gap: 10px;
}

.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #333;
}

.username {
  font-weight: 600;
  font-size: 14px;
}

/* IMAGE */
.post img {
  width: 100%;
  display: block;
}

/* ACTION ROW (REAL INSTAGRAM STYLE) */
.actions {
  display: flex;
  justify-content: space-between;
  padding: 10px 12px 6px 12px;
  font-size: 22px;
}

.left-actions {
  display: flex;
  gap: 14px;
}

.icon {
  cursor: pointer;
}

/* LIKE COUNT */
.likes {
  font-weight: 600;
  font-size: 14px;
  padding: 0 12px;
}

/* CAPTION */
.caption {
  padding: 6px 12px;
  font-size: 14px;
}

.caption b {
  margin-right: 5px;
}

/* COMMENTS PREVIEW */
.comment-preview {
  padding: 0 12px;
  font-size: 13px;
  opacity: 0.7;
}

/* LOGIN BUTTON */
button {
  background: none;
  border: 1px solid #333;
  color: white;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="topbar">
  <b>Instagram</b>
  <div id="userBox">
    <button onclick="login()">Login</button>
  </div>
</div>

<div id="feed" class="feed"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot,
  doc,
  updateDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBUWEdDO4t0ej8Xbb4XRbnVHIPkNLGyc9c",
  authDomain: "gkampasgallery.firebaseapp.com",
  projectId: "gkampasgallery",
  storageBucket: "gkampasgallery.firebasestorage.app",
  messagingSenderId: "697722298225",
  appId: "1:697722298225:web:e6ffc5ba7ea55744bb20d0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;

/* AUTH */
window.login = () => signInWithPopup(auth, provider);
window.logout = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  currentUser = user;

  document.getElementById("userBox").innerHTML = user
    ? `<button onclick="logout()">Logout</button>`
    : `<button onclick="login()">Login</button>`;
});

/* FEED */
const feed = document.getElementById("feed");

const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));

onSnapshot(q, (snap) => {

  feed.innerHTML = "";

  snap.forEach((d) => {

    const post = d.data();
    const id = d.id;

    const likes = post.likes || {};
    const likeCount = Object.keys(likes).length;
    const liked = currentUser && likes[currentUser.uid];

    feed.innerHTML += `
      <div class="post">

        <!-- HEADER -->
        <div class="post-header">
          <div class="avatar"></div>
          <div class="username">gkampas</div>
        </div>

        <!-- IMAGE -->
        <img src="${post.image}">

        <!-- ACTIONS -->
        <div class="actions">
          <div class="left-actions">
            <div class="icon" onclick="likePost('${id}')">
              ${liked ? "❤️" : "🤍"}
            </div>
            <div class="icon">💬</div>
            <div class="icon">📤</div>
          </div>
          <div class="icon">🔖</div>
        </div>

        <!-- LIKES -->
        <div class="likes">${likeCount} likes</div>

        <!-- CAPTION -->
        <div class="caption">
          <b>${post.title}</b> ${post.description}
        </div>

        <!-- COMMENT PREVIEW -->
        <div class="comment-preview">
          View all comments
        </div>

      </div>
    `;

  });

});

/* LIKE SYSTEM */
window.likePost = async (postId) => {

  if (!currentUser) {
    await signInWithPopup(auth, provider);
    return;
  }

  const ref = doc(db, "posts", postId);
  const snap = await getDoc(ref);

  const data = snap.data();
  const likes = data.likes || {};
  const uid = currentUser.uid;

  if (likes[uid]) {
    delete likes[uid];
  } else {
    likes[uid] = true;
  }

  await updateDoc(ref, { likes });

};

</script>

</body>
</html>
